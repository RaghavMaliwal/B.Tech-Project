<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Monitoring System</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --border: #cbd5e1;
      --text: #1e293b;
      --muted: #64748b;
      --input: #f8fafc;
      --green: #22c55e;
      --orange: #f59e0b;
      --red: #ef4444
    }

    html,
    body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden
    }

    body {
      display: flex;
      flex-direction: column
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 16px 20px 12px;
      gap: 12px
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0
    }

    .header h1 {
      font-size: 1.85rem;
      font-weight: 700
    }

    .btn-orange {
      background: var(--orange);
      color: #000;
      border: none;
      padding: 13px 26px;
      font-size: .95rem;
      font-weight: 800;
      border-radius: 10px;
      cursor: pointer
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      flex-shrink: 0
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 11px;
      border: 2px solid transparent;
      transition: border-color .3s
    }

    .card.alert-card {
      border-color: var(--red);
      animation: blink 1s infinite alternate
    }

    @keyframes blink {
      to {
        border-color: transparent
      }
    }

    .card-label {
      font-size: 2rem;
      font-weight: 700
    }

    .card-value {
      font-size: 1.5rem;
      font-weight: 600
    }

    .s-normal {
      color: var(--green)
    }

    .s-alert {
      color: var(--red)
    }

    .ctrl-group {
      display: flex;
      gap: 8px
    }

    .ctrl-btn {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: var(--input);
      border: 2px solid var(--border);
      color: var(--text);
      font-size: 15px;
      cursor: pointer
    }

    .ctrl-btn:hover {
      background: var(--border)
    }

    .bottom {
      display: flex;
      gap: 12px;
      flex: 1;
      min-height: 0
    }

    .patient-panel {
      width: 358px;
      flex-shrink: 0;
      background: var(--card);
      border-radius: 12px;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto
    }

    .patient-panel h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 3px
    }

    .patient-panel input {
      background: var(--input);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 11px;
      border-radius: 7px;
      font-size: 1rem;
      outline: none;
      width: 100%
    }

    .patient-panel input::placeholder {
      color: var(--muted)
    }

    .patient-panel input:focus {
      border-color: #4a7ba7
    }

    .btn-green {
      background: var(--green);
      color: #000;
      border: none;
      padding: 10px;
      border-radius: 7px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      margin-top: 2px
    }

    .charts {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
      min-width: 0;
      overflow-y: auto
    }

    .chart-wrap {
      flex: 1;
      min-height: 210px;
      background: var(--card);
      border-radius: 12px;
      padding: 12px;
      padding-bottom: 0%;
      display: flex;
      flex-direction: column;
      min-width: 0
    }

    canvas {
      flex: 1;
      width: 100%;
      min-height: 0;
      display: block
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .65);
      z-index: 1000;
      align-items: center;
      justify-content: center
    }

    .modal-overlay.show {
      display: flex
    }

    .modal-box {
      background: var(--card);
      border-radius: 16px;
      padding: 38px 46px;
      text-align: center;
      border: 1px solid var(--border);
      min-width: 320px
    }

    .modal-icon {
      width: 56px;
      height: 56px;
      background: var(--green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      color: #000;
      margin: 0 auto 14px
    }

    .modal-box h3 {
      font-size: 1.1rem;
      margin-bottom: 6px
    }

    .modal-box p {
      color: var(--muted);
      font-size: .82rem;
      margin-bottom: 20px;
      word-break: break-all
    }

    .modal-box button {
      background: var(--green);
      color: #000;
      border: none;
      padding: 10px 34px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer
    }
  

    /* ===== Header extras ===================================================== */
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .conn-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 44px;
      padding: 0 14px;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 10px;
      font: 700 .85rem 'Segoe UI', sans-serif;
      color: var(--text);
      cursor: pointer
    }

    .conn-pill:hover,
    .icon-btn:hover {
      background: var(--border)
    }

    .conn-pill .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--muted)
    }

    .conn-pill.ok .dot {
      background: var(--green)
    }

    .conn-pill.off .dot {
      background: var(--red)
    }

    .conn-pill.wait .dot {
      animation: dotblink 1s infinite alternate
    }

    @keyframes dotblink {
      to {
        opacity: .25
      }
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--card);
      border: 2px solid var(--border);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .icon-btn svg {
      width: 22px;
      height: 22px
    }

    /* ===== Banners (in-flow, slim) =========================================== */
    .banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: .9rem
    }

    .banner.show {
      display: flex
    }

    .banner.red {
      background: var(--red);
      color: #fff
    }

    .banner.amber {
      background: var(--orange);
      color: #000
    }

    .banner button {
      background: rgba(255, 255, 255, .22);
      color: inherit;
      border: 1.5px solid currentColor;
      border-radius: 7px;
      padding: 4px 12px;
      font: 700 .8rem 'Segoe UI', sans-serif;
      cursor: pointer;
      white-space: nowrap
    }

    /* ===== Tabs ============================================================== */
    .tabs {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      overflow-x: auto
    }

    .tab {
      flex-shrink: 0;
      padding: 9px 18px;
      background: var(--card);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: 10px;
      font: 700 .98rem 'Segoe UI', sans-serif;
      cursor: pointer;
      white-space: nowrap
    }

    .tab:hover {
      background: #e2e8f0
    }

    .tab.active {
      background: var(--text);
      border-color: var(--text);
      color: #fff
    }

    .tab.compact-tab {
      margin-left: auto
    }

    .tab.alert,
    .tab.alert.active {
      border-color: var(--red);
      animation: tabblink .9s infinite alternate
    }

    .tab.alert.active {
      box-shadow: 0 0 0 3px var(--text)
    }

    @keyframes tabblink {
      from {
        background: var(--red);
        color: #fff
      }

      to {
        background: #fee2e2;
        color: #b91c1c
      }
    }

    /* ===== Panels ============================================================ */
    #panels {
      flex: 1;
      min-height: 0;
      position: relative
    }

    .panel {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column
    }

    .panel[hidden] {
      display: none !important
    }

    .panel-inner {
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100%;
      min-height: 0
    }

    .card-value.s-warn {
      color: var(--orange)
    }

    .card-value.s-muted {
      color: var(--muted)
    }

    .card-value {
      text-align: center
    }

    /* ===== Alert lock (blurred + inactive until acknowledged) ================= */
    .lock {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(241, 245, 249, .55);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      border-radius: 12px
    }

    .lock[hidden] {
      display: none
    }

    .lock-box {
      background: var(--card);
      border: 2px solid var(--red);
      border-radius: 16px;
      padding: 30px 42px;
      text-align: center;
      max-width: 470px;
      box-shadow: 0 10px 40px rgba(15, 23, 42, .18)
    }

    .lock-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--red);
      color: #fff;
      font-size: 28px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      animation: ring 1.3s infinite
    }

    @keyframes ring {
      0% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, .5)
      }

      100% {
        box-shadow: 0 0 0 16px rgba(239, 68, 68, 0)
      }
    }

    .lock-box h3 {
      font-size: 1.25rem;
      margin-bottom: 6px
    }

    .lock-box p {
      color: var(--muted);
      font-size: .92rem;
      margin-bottom: 4px
    }

    .lock-box .reason {
      color: var(--red);
      font-weight: 700;
      margin-bottom: 14px
    }

    .lock-err {
      color: var(--red);
      font-size: .82rem;
      min-height: 1.1em;
      margin-top: 8px
    }

    .btn-red {
      background: var(--red);
      color: #fff;
      border: none;
      padding: 12px 40px;
      border-radius: 10px;
      font: 800 1rem 'Segoe UI', sans-serif;
      cursor: pointer
    }

    .btn-red:disabled {
      opacity: .6;
      cursor: default
    }

    /* ===== Compact view ====================================================== */
    .compact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 12px;
      height: 100%;
      min-height: 0
    }

    .ztile {
      position: relative;
      background: var(--card);
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 10px 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0;
      min-width: 0;
      cursor: pointer;
      overflow: hidden
    }

    .ztile:hover {
      border-color: var(--border)
    }

    .ztile.alert-card {
      border-color: var(--red);
      animation: blink 1s infinite alternate
    }

    .ztile-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px
    }

    .ztile-title {
      font-size: 1.15rem;
      font-weight: 700
    }

    .badge {
      padding: 3px 11px;
      border-radius: 20px;
      font-size: .74rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .4px
    }

    .badge.b-ok {
      background: rgba(34, 197, 94, .15);
      color: #15803d
    }

    .badge.b-warn {
      background: rgba(245, 158, 11, .18);
      color: #b45309
    }

    .badge.b-alert {
      background: var(--red);
      color: #fff
    }

    .badge.b-off {
      background: #e2e8f0;
      color: var(--muted)
    }

    .ztile-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      flex: 1;
      min-height: 0
    }

    .mcol {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      border: 2px solid transparent;
      border-radius: 9px;
      padding: 2px 4px
    }

    .mcol.alert-card {
      border-color: var(--red);
      animation: blink 1s infinite alternate
    }

    .mcol .mlabel {
      font-size: .74rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .4px
    }

    .mcol .mval {
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1.15
    }

    .mcol canvas {
      flex: 1;
      min-height: 60px
    }

    .tile-lock {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(241, 245, 249, .55);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      text-align: center;
      cursor: default
    }

    .tile-lock[hidden] {
      display: none
    }

    .tile-lock strong {
      color: var(--red);
      font-size: 1rem
    }

    .tile-lock .btn-red {
      padding: 9px 28px;
      font-size: .92rem
    }

    /* ===== Dialogs =========================================================== */
    .dlg {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: min(660px, 92vw);
      max-height: min(84vh, 720px);
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
      overflow: hidden
    }

    .dlg.sm {
      width: min(440px, 92vw)
    }

    .dlg-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 10px
    }

    .dlg-title {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .dlg-title svg {
      width: 24px;
      height: 24px
    }

    .dlg-title h3 {
      font-size: 1.2rem
    }

    .dlg-x {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--input);
      border: 1.5px solid var(--border);
      color: var(--text);
      font-size: 15px;
      cursor: pointer
    }

    .dlg-x:hover {
      background: var(--border)
    }

    .seg {
      display: flex;
      gap: 6px;
      padding: 0 20px 12px
    }

    .seg button {
      flex: 1;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--input);
      border: 1.5px solid var(--border);
      color: var(--text);
      font: 700 .85rem 'Segoe UI', sans-serif;
      cursor: pointer
    }

    .seg button.active {
      background: var(--text);
      border-color: var(--text);
      color: #fff
    }

    .dlg-body {
      padding: 4px 20px 16px;
      overflow-y: auto;
      flex: 1;
      min-height: 0
    }

    .dlg-foot {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-top: 1px solid var(--border);
      background: var(--input);
      font-size: .78rem;
      color: var(--muted)
    }

    .dlg-foot .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted)
    }

    .dlg-foot.ok .dot {
      background: var(--green)
    }

    .dlg-foot.off .dot {
      background: var(--red)
    }

    .hint {
      color: var(--muted);
      font-size: .82rem;
      margin-bottom: 12px;
      line-height: 1.4
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap
    }

    .row.between {
      justify-content: space-between
    }

    .mgrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 12px 0
    }

    .mcard {
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      background: var(--input);
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .mcard.running {
      border-color: var(--green);
      background: #f0fdf4
    }

    .mcard .nm {
      font-weight: 700;
      font-size: .95rem
    }

    .mcard .sub {
      color: var(--muted);
      font-size: .74rem
    }

    .btn-sm {
      background: var(--text);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font: 700 .85rem 'Segoe UI', sans-serif;
      cursor: pointer
    }

    .btn-sm:hover:not(:disabled) {
      filter: brightness(1.25)
    }

    .btn-sm.green {
      background: var(--green);
      color: #000
    }

    .btn-sm.red {
      background: var(--red)
    }

    .btn-sm.ghost {
      background: var(--input);
      color: var(--text);
      border: 1.5px solid var(--border)
    }

    .btn-sm:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    .mcard.running .btn-sm {
      animation: dotblink .8s infinite alternate
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: .78rem;
      font-weight: 700;
      color: var(--muted)
    }

    .field input,
    .field select,
    .dlg input.txt {
      background: var(--input);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 7px;
      font-size: .95rem;
      outline: none;
      width: 100%
    }

    .field input:focus,
    .field select:focus,
    .dlg input.txt:focus {
      border-color: #4a7ba7
    }

    .zsel {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 12px
    }

    .zsel button {
      padding: 7px 4px;
      border-radius: 8px;
      background: var(--input);
      border: 1.5px solid var(--border);
      font: 700 .78rem 'Segoe UI', sans-serif;
      color: var(--text);
      cursor: pointer
    }

    .zsel button.active {
      background: var(--orange);
      border-color: var(--orange);
      color: #000
    }

    .kv {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 14px
    }

    .kv div {
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 9px
    }

    .kv small {
      display: block;
      color: var(--muted);
      font-size: .68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .3px
    }

    .kv b {
      font-size: .95rem;
      font-family: Consolas, 'Courier New', monospace
    }

    .step {
      display: flex;
      gap: 12px;
      padding: 12px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      margin-bottom: 10px
    }

    .step.off {
      opacity: .5
    }

    .step.done {
      border-color: var(--green);
      background: #f0fdf4
    }

    .step .num {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--text);
      color: #fff;
      font-weight: 800;
      font-size: .85rem;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .step.done .num {
      background: var(--green);
      color: #000
    }

    .step .grow {
      flex: 1;
      min-width: 0
    }

    .step h4 {
      font-size: .92rem;
      margin-bottom: 2px
    }

    .step .row {
      margin-top: 8px;
      align-items: flex-end
    }

    .step .field {
      width: 130px
    }

    .step .res {
      margin-top: 6px;
      font-size: .78rem;
      color: var(--muted);
      font-family: Consolas, 'Courier New', monospace
    }

    .msg {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: .84rem;
      font-weight: 600;
      display: none
    }

    .msg.show {
      display: block
    }

    .msg.ok {
      background: #dcfce7;
      color: #166534
    }

    .msg.err {
      background: #fee2e2;
      color: #991b1b
    }

    .msg.info {
      background: #e0f2fe;
      color: #075985
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0 14px
    }

    .chip {
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--input);
      border: 1px solid var(--border);
      font: 700 .78rem Consolas, 'Courier New', monospace
    }

    .chip.good {
      background: #dcfce7;
      border-color: #86efac;
      color: #166534
    }

    .tbl {
      width: 100%;
      border-collapse: collapse;
      font-size: .85rem
    }

    .tbl th {
      text-align: left;
      color: var(--muted);
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .3px;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border)
    }

    .tbl td {
      padding: 8px;
      border-bottom: 1px solid #eef2f7
    }

    .pill {
      padding: 2px 9px;
      border-radius: 20px;
      font-size: .72rem;
      font-weight: 800
    }

    .pill.ok {
      background: #dcfce7;
      color: #166534
    }

    .pill.bad {
      background: #fee2e2;
      color: #991b1b
    }

    .sect {
      font-size: .72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--muted)
    }

    .pane[hidden] {
      display: none
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="header">
      <h1>Patient Monitoring System</h1>
      <div class="header-right">
        <button class="conn-pill wait" id="conn-pill" onclick="openConnDialog()" title="Device connection">
          <span class="dot"></span><span id="conn-text">Connecting&hellip;</span>
        </button>
        <button class="icon-btn" id="diag-btn" onclick="Diag.open()" title="Diagnostics" aria-label="Diagnostics">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <defs><mask id="wcut-h" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24"><rect width="24" height="24" fill="#fff" /><path d="M5 5 L19.5 19.5" stroke="#000" stroke-width="5.2" stroke-linecap="round" fill="none" /></mask></defs>
            <path mask="url(#wcut-h)" d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
            <path d="M3.4 3.4 L12.6 12.6" />
            <path d="M12.2 12.2 L19.6 19.6" stroke-width="4.6" />
          </svg>
        </button>
      </div>
    </header>

    <div class="banner red" id="alert-bar"><span id="alert-text"></span><button id="alert-go">Go to zone</button></div>
    <div class="banner amber" id="offline-bar"><span id="offline-text"></span><button onclick="openConnDialog()">Connection settings</button></div>

    <nav class="tabs" id="tabs"></nav>
    <main id="panels"></main>
  </div>

  <!-- CSV saved -->
  <div class="modal-overlay" id="modal">
    <div class="modal-box">
      <div class="modal-icon">&#x2713;</div>
      <h3>CSV Downloaded Successfully</h3>
      <p id="modal-path"></p>
      <button onclick="closeModal()">OK</button>
    </div>
  </div>

  <!-- Device connection -->
  <div class="modal-overlay" id="conn-overlay">
    <div class="dlg sm" role="dialog" aria-modal="true" aria-labelledby="conn-title">
      <div class="dlg-head">
        <div class="dlg-title"><h3 id="conn-title">Device Connection</h3></div>
        <button class="dlg-x" onclick="closeConnDialog()" aria-label="Close">&#x2715;</button>
      </div>
      <div class="dlg-body">
        <p class="hint">Enter the ESP32&rsquo;s IP address (printed in the Arduino serial monitor at start-up) or its
          network name. The default <b>pressureguard.local</b> works on most networks.</p>
        <label class="field">ESP32 address
          <input class="txt" id="conn-host" placeholder="e.g. 192.168.1.50" spellcheck="false" autocomplete="off">
        </label>
        <div class="msg" id="conn-msg"></div>
        <div class="row between" style="margin-top:14px">
          <span class="hint" id="conn-detail" style="margin:0"></span>
          <button class="btn-sm green" id="conn-save" onclick="saveConnHost()">Save &amp; Connect</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Diagnostics -->
  <div class="modal-overlay" id="diag-overlay">
    <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="diag-title">
      <div class="dlg-head">
        <div class="dlg-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <defs><mask id="wcut-d" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24"><rect width="24" height="24" fill="#fff" /><path d="M5 5 L19.5 19.5" stroke="#000" stroke-width="5.2" stroke-linecap="round" fill="none" /></mask></defs>
            <path mask="url(#wcut-d)" d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
            <path d="M3.4 3.4 L12.6 12.6" />
            <path d="M12.2 12.2 L19.6 19.6" stroke-width="4.6" />
          </svg>
          <h3 id="diag-title">Device Diagnostics</h3>
        </div>
        <button class="dlg-x" onclick="Diag.close()" aria-label="Close">&#x2715;</button>
      </div>
      <div class="seg" id="diag-tabs">
        <button data-pane="motors" class="active">Motor Test</button>
        <button data-pane="fsr">FSR Calibration</button>
        <button data-pane="i2c">I&sup2;C &amp; Sensors</button>
      </div>
      <div class="dlg-body">
        <div class="pane" id="pane-motors"></div>
        <div class="pane" id="pane-fsr" hidden></div>
        <div class="pane" id="pane-i2c" hidden></div>
      </div>
      <div class="dlg-foot" id="diag-foot"><span class="dot"></span><span id="diag-foot-text">&mdash;</span></div>
    </div>
  </div>

  <script src="chart-mini.js"></script>
  <script src="diagnostics.js"></script>
  <script src="renderer.js"></script>
</body>

</html>
